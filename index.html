<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceInsideGalaxy</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: #000; 
      overflow-x: hidden; 
    }

    /* --- ВИДЕО ФОН НА ВЕСЬ ЭКРАН (ЖЕСТКО) --- */
    .bg-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; 
      height: 100vh; 
      height: 100lvh; 
      z-index: -1;
      overflow: hidden;
      transform: translateZ(0);
      will-change: transform;
    }

    .bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover; 
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Затемнение видео, чтобы кнопки читались */
    .bg-container::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, rgba(224, 234, 245, 0.1) 0%, rgba(224, 234, 245, 0.6) 50%, rgba(224, 234, 245, 0.95) 100%);
      z-index: 1;
    }

    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 250px 20px 60px 20px; 
      position: relative;
      z-index: 2;
      margin: 0 auto; 
    }

    h1 {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 30px;
      color: #1a1a1a;
      text-shadow: 0 4px 15px rgba(255,255,255,0.9); 
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUpLoad 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s forwards;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* --- КНОПКИ --- */
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 12px 20px;
      
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.2));
      backdrop-filter: blur(12px) saturate(150%); 
      -webkit-backdrop-filter: blur(12px) saturate(150%); 
      
      border: 1px solid rgba(255, 255, 255, 0.8); 
      border-radius: 35px;
      color: #000; 
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.1), 
        inset 0 2px 10px rgba(255, 255, 255, 0.9), 
        inset 0 -2px 5px rgba(0, 0, 0, 0.05);
      
      height: 68px;
      cursor: pointer;
      
      opacity: 0;
      transform: translateY(30px); 
      transition: opacity 0.4s ease-out, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .link-btn.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .link-btn:active {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.6);
      transition: transform 0.1s ease-out;
    }

    .icon-wrapper {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%); 
      width: 50px; height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* Цвета иконок */
    .bg-twitch { background: #9146FF; color: #fff; }
    .bg-boosty { background: #f97316; color: #fff; }
    .bg-donatepay { background: #22c55e; color: #fff; }
    .bg-telegram { background: #26A5E4; color: #fff; }
    .bg-tiktok { background: #000000; color: #fff; }
    .bg-youtube { background: #FF0000; color: #fff; }
    .bg-spotify { background: #1DB954; color: #fff; }
    .bg-apple { background: #FA243C; color: #fff; }
    .bg-linemusic { background: #06C755; color: #fff; }

    /* Спец. стили для картинок и SVG внутри иконок */
    .icon-wrapper img {
      width: 26px; height: 26px;
      display: block; margin: 0 auto; 
      filter: brightness(0) invert(1); 
    }

    .icon-wrapper svg {
      width: 46px; height: 46px;
      fill: #fff; display: block; margin: 0 auto; 
    }

    @keyframes fadeUpLoad {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  
  <div class="bg-container">
    <video 
      id="myVideo"
      class="bg-video" 
      autoplay 
      loop 
      muted 
      playsinline
      webkit-playsinline="true"
      preload="auto"
      disablepictureinpicture>
      <source src="video.mp4" type="video/mp4">
    </video>
  </div>

  <div class="container">
    <h1>@VoiceInsideGalaxy</h1>
    <div class="links" id="links-container"></div>
  </div>

  <script src="links.js"></script>

  <script>
    // --- ЯДЕРНЫЙ ФИКС ДЛЯ ОПЕРЫ ---
    document.addEventListener("DOMContentLoaded", function() {
      const video = document.getElementById('myVideo');
      if (video) {
        video.muted = true;
        let playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            const playOnInteraction = () => video.play();
            document.body.addEventListener('touchstart', playOnInteraction, { once: true });
            document.body.addEventListener('click', playOnInteraction, { once: true });
          });
        }
      }
    });

    // --- ГЕНЕРАЦИЯ КНОПОК ---
    document.addEventListener("DOMContentLoaded", function() {
      const container = document.getElementById('links-container');
      
      myLinks.forEach(link => {
        const a = document.createElement('a');
        a.href = link.url; a.className = 'link-btn'; a.target = '_blank';
        
        const iconDiv = document.createElement('div');
        iconDiv.className = `icon-wrapper ${link.colorClass}`;

        if (link.type === 'icon') {
          const i = document.createElement('i'); i.className = link.iconClass; iconDiv.appendChild(i);
        } else if (link.type === 'image') {
          const img = document.createElement('img'); img.src = link.imgSrc; img.alt = link.name; iconDiv.appendChild(img);
        } else if (link.type === 'svg') {
          if (link.id === 'linemusic') {
            // ИДЕАЛЬНЫЙ SVG ДЛЯ LINE MUSIC (уменьшенный размер 26px)
            iconDiv.innerHTML = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 26px; height: 26px; fill: none; stroke: #ffffff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; display: block;">
              <path d="M8 5 L20 2" />
              <path d="M8 9 L20 6" />
              <path d="M8 9 V18" />
              <circle cx="5" cy="18" r="3" />
              <path d="M20 6 V15" />
              <circle cx="17" cy="15" r="3" />
            </svg>`;
          } else {
            iconDiv.innerHTML = `<svg viewBox="0 0 248 248" xmlns="http://www.w3.org/2000/svg"><path d="${link.svgPath}"/></svg>`;
          }
        }

        const textNode = document.createTextNode(link.name);
        a.appendChild(iconDiv); a.appendChild(textNode); container.appendChild(a);
      });

      // --- ЛОГИКА ПОЯВЛЕНИЯ ---
      const buttons = document.querySelectorAll('.link-btn');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target); 
          }
        });
      }, { threshold: 0.1 });

      buttons.forEach((btn, index) => {
        btn.style.transitionDelay = `${index * 0.1}s`;
        observer.observe(btn);
      });
    });
  </script>
</body>
</html>
